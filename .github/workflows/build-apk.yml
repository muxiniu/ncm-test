      - name: Build APK
        run: |
          unset ANDROID_SDK_ROOT
          rm -rf .gradle build app/build
          echo "--- Starting Build ---"
          # 去掉 || true，构建失败必须暴露
          gradle assembleDebug --no-daemon -Dandroid.sdk.path=$ANDROID_HOME --refresh-dependencies
          
          echo "--- Forced File Check ---"
          ls -R app/src/main/ || true
          ls -la app/build/outputs/apk/debug/ || echo "APK目录不存在！构建可能失败了"

      - name: Upload APK
        # 只有成功才上传，且找不到文件时直接报错（不再假成功）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error # 关键：找不到APK就让步骤变红失败
