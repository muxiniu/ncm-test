name: Build NCM Decoder Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.4
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          mv gradle-8.4 gradle-home
          echo "$PWD/gradle-home/bin" >> $GITHUB_PATH

      - name: Manual Setup Android SDK
        run: |
          # 清除旧环境变量
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=$HOME/android-sdk
          
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmd.zip
          unzip -q cmd.zip
          mv cmdline-tools latest
          
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          # 持久化环境变量（只留 ANDROID_HOME）
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV

      - name: Init Gradle Wrapper & local.properties
        run: |
          gradle wrapper --gradle-version 8.4 || true
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi
          # 核心：直接写入 local.properties，让 Gradle 100% 找到 SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build APK
        run: |
          unset ANDROID_SDK_ROOT
          # 显式传入 ANDROID_HOME 和 sdk.dir，双重保险
          gradle assembleDebug --no-daemon -Dandroid.sdk.path=$ANDROID_HOME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: app/build/outputs/apk/debug/*.apk
