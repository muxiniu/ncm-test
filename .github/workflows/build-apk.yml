name: Build NCM Decoder Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          rm cmdline.zip
          
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV

      - name: Create Minimal Project (Final Fix)
        run: |
          rm -rf app build .gradle src local.properties gradle gradlew gradlew.bat
          mkdir -p app/src/main/java/com/muxiniu/ncmtest
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          
          # 1. Manifest (绝对路径防丢失)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="NCM Decoder" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 2. Java
          cat > app/src/main/java/com/muxiniu/ncmtest/MainActivity.java << 'EOF'
          package com.muxiniu.ncmtest;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          
          # 3. 空资源 (防止资源合并报错)
          echo '<resources></resources>' > app/src/main/res/values/strings.xml
          
          # 4. Settings (锁定仓库)
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF
          
          # 5. Build (【关键】固定 AGP 8.1.4 + 强制 sourceSets)
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4'
          }
          android {
              namespace 'com.muxiniu.ncmtest'
              compileSdk 34
              
              sourceSets {
                  main {
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                  }
              }
              
              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  applicationId "com.muxiniu.ncmtest"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "--- Hard File Verification ---"
          find . -type f | sort
          ls -l app/src/main/AndroidManifest.xml

      - name: Build APK (Gradle 8.0 + AGP 8.1.4)
        run: |
          unset ANDROID_SDK_ROOT
          rm -rf .gradle build app/build gradle gradlew*
          
          # AGP 8.1.4 官方推荐 Gradle 8.0
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          
          ./gradlew assembleDebug --no-daemon -Dandroid.sdk.path=$ANDROID_HOME --warning-mode all
          
          echo "--- APK Output Check ---"
          ls -la app/build/outputs/apk/debug/ || 
