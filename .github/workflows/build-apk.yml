name: Build NCM Decoder Pro APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Manual Setup Android SDK (Bypass Action Deprecation)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          # 使用稳定版 cmdline-tools
          curl -sLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          # 接受协议并安装必要组件 (API 34)
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV

      - name: Create Minimal Project (Align with Preinstalled AGP 8.3.0)
        run: |
          rm -rf app build .gradle src local.properties gradle gradlew gradlew.bat
          mkdir -p app/src/main/java/com/muxiniu/ncmtest
          
          # 1. Manifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="NCM Decoder" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 2. Java
          cat > app/src/main/java/com/muxiniu/ncmtest/MainActivity.java << 'EOF'
          package com.muxiniu.ncmtest;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          
          # 3. Settings (不强制锁定 AGP 版本，让环境预装的 8.3.0 生效)
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF
          
          # 4. Build (【关键修复】移除 version '8.5.0'，避免与预装 8.3.0 冲突)
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.muxiniu.ncmtest'
              compileSdk 34
              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  applicationId "com.muxiniu.ncmtest"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "--- Project Files Verified ---"
          ls -R app

      - name: Build APK (Use Gradle 8.4 matching AGP 8.3.0)
        run: |
          unset ANDROID_SDK_ROOT
          rm -rf .gradle build app/build
          # AGP 8.3.0 官方推荐 Gradle 8.4，不再用 8.5 避免潜在不兼容
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon -Dandroid.sdk.path=$ANDROID_HOME --warning-mode all
          
          echo "--- APK Output Check ---"
          ls -la app/build/outputs/apk/debug/ || echo "构建失败：APK目录不存在"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
