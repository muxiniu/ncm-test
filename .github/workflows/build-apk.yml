name: Build NCM Decoder Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Manual Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmd.zip
          unzip -q cmd.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV

      - name: Clean & Create Minimal Project (Strict Default Paths)
        run: |
          # 彻底清理，包含根目录可能的残留
          rm -rf app build .gradle src local.properties
          mkdir -p app/src/main/java/com/muxiniu/ncmtest
          
          # 1. AndroidManifest.xml (严格默认路径)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="NCM Decoder" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 2. MainActivity.java
          cat > app/src/main/java/com/muxiniu/ncmtest/MainActivity.java << 'EOF'
          package com.muxiniu.ncmtest;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          
          # 3. settings.gradle (无自定义仓库干扰，标准配置)
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF
          
          # 4. app/build.gradle (完全移除 sourceSets，依赖 AGP 默认寻址)
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.muxiniu.ncmtest'
              compileSdk 34
              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  applicationId "com.muxiniu.ncmtest"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF
          
          # 5. local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "--- Strict Path Verification ---"
          pwd
          ls -R app
          echo "Manifest exists:"
          ls -l app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          unset ANDROID_SDK_ROOT
          rm -rf .gradle build app/build
          # 打印即将执行的构建信息，捕获具体缺失文件路径
          echo "--- Starting Build ---"
          gradle assembleDebug --no-daemon -Dandroid.sdk.path=$ANDROID_HOME --refresh-dependencies || true
          
          echo "--- Forced File Check ---"
          ls -R app/src/main/
          
          echo "--- APK Output ---"
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: app/build/outputs/apk/debug/*.apk
