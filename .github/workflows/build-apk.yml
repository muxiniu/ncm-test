name: Build NCM Decoder Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.4
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          mv gradle-8.4 gradle-home
          echo "$PWD/gradle-home/bin" >> $GITHUB_PATH

      - name: Manual Setup Android SDK
        run: |
          # 清除 GitHub 自带的旧 SDK 环境变量，防止冲突
          unset ANDROID_SDK_ROOT
          
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmd.zip
          unzip -q cmd.zip
          mv cmdline-tools latest
          
          # 仅设置 ANDROID_HOME (统一路径)
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          # 持久化到 GITHUB_ENV (供后续步骤使用)
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          # 确保不导出废弃变量
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV

      - name: Init Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 || true
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/work/_tool/android-sdk
        run: |
          # 再次兜底清理，确保 Gradle 只看到唯一路径
          unset ANDROID_SDK_ROOT
          gradle assembleDebug --no-daemon -Dandroid.sdk.path=$ANDROID_HOME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: app/build/outputs/apk/debug/*.apk
