name: Build NCM Decoder Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.4
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          mv gradle-8.4 gradle-home
          echo "$PWD/gradle-home/bin" >> $GITHUB_PATH

      - name: Manual Setup Android SDK
        run: |
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmd.zip
          unzip -q cmd.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV

      - name: Clean & Create Minimal Project (100% Self-Contained)
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/muxiniu/ncmtest
          
          # 1. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="NCM Decoder" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 2. MainActivity.java
          cat > app/src/main/java/com/muxiniu/ncmtest/MainActivity.java << 'EOF'
          package com.muxiniu.ncmtest;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          
          # 3. settings.gradle (核心：声明插件仓库，优先 google())
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF
          
          # 4. app/build.gradle (显式版本 + buildscript 仓库兜底)
          cat > app/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.3.0'
              }
          }
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.muxiniu.ncmtest'
              compileSdk 34
              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  applicationId "com.muxiniu.ncmtest"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              sourceSets {
                  main { manifest.srcFile 'src/main/AndroidManifest.xml' }
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          EOF
          
          # 5. local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 初始化 wrapper (可选，主要用 gradle 命令)
          gradle wrapper --gradle-version 8.4 || true
          echo "--- Project Tree ---"
          ls -la
          find app -type f

      - name: Build APK
        run: |
          unset ANDROID_SDK_ROOT
          # 直接用 gradle，避免 ./gradlew 路径问题
          gradle assembleDebug --no-daemon -Dandroid.sdk.path=$ANDROID_HOME --refresh-dependencies
          echo "--- 
